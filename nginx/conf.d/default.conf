# TLS cert covers both app.sefedsystem.com and api.sefedsystem.com
# (issued as a single cert under the app.sefedsystem.com directory)

# --- HTTP -> HTTPS redirect for both subdomains ---
# No /.well-known/acme-challenge/ location here: renewal stops this container
# entirely and lets certbot bind port 80 itself (per the pre/post renewal
# hooks already installed on the VPS), so nginx never needs to serve
# challenge files.
server {
    listen 80;
    server_name app.sefedsystem.com api.sefedsystem.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Client portal (Next.js) ---
server {
    listen 443 ssl;
    http2 on;
    server_name app.sefedsystem.com;

    ssl_certificate     /etc/letsencrypt/live/app.sefedsystem.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.sefedsystem.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 10M;

    location / {
        proxy_pass http://portal:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- API (ASP.NET Core) ---
# Reached by the desktop kiosk agents in the field over the public internet.
# The portal itself never calls this from the browser or over the public
# internet — see BACKEND_API_URL in docker-compose.yml.
server {
    listen 443 ssl;
    http2 on;
    server_name api.sefedsystem.com;

    ssl_certificate     /etc/letsencrypt/live/app.sefedsystem.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.sefedsystem.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 10M;

    location / {
        proxy_pass http://api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
